name: Sync magpie image to Docker Hub

# 每天 UTC 05:17(北京时间 13:17)比对并同步;push 时也跑一次(首推送即首同步)
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write # 仅供底部 keepalive 步骤推送空 commit

env:
  SRC: ghcr.io/yetone/magpie
  TAGS: latest stable # magpie 官方 tag;edge 更新太频繁,版本号 tag 只增不减,均不同步

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install skopeo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo

      - name: Check secrets
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 未设置,请到 Settings → Secrets and variables → Actions 添加"
            exit 1
          fi
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Docker Hub
        run: skopeo login docker.io -u "$DOCKERHUB_USERNAME" -p "$DOCKERHUB_TOKEN"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sync changed tags
        env:
          DST: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/magpie
        run: |
          set -euo pipefail
          for TAG in $TAGS; do
            SRC_REF="docker://$SRC:$TAG"
            DST_REF="docker://$DST:$TAG"

            SRC_DIGEST=$(skopeo inspect "$SRC_REF" | jq -r .Digest)
            if DST_DIGEST=$(skopeo inspect "$DST_REF" 2>/dev/null | jq -r .Digest) \
               && [ "$DST_DIGEST" = "$SRC_DIGEST" ]; then
              echo "::notice::$TAG 未变化($SRC_DIGEST)"
              continue
            fi

            echo "::notice::$TAG: ${DST_DIGEST:-<不存在>} -> $SRC_DIGEST,开始复制"
            # --all 保留多架构 manifest list(amd64 / arm64)
            skopeo copy --all --retry-times 5 "$SRC_REF" "$DST_REF"
          done

      # 仅推代码时同步镜像页描述;每日定时跑时不重复
      - name: Update Docker Hub description
        if: github.event_name == 'push'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # 当前 Docker Hub API:POST /v2/auth/token 换取 Bearer token(老 /v2/users/login + JWT 已无仓库写权限)
          TOKEN=$(curl -s -w "\n%{http_code}" -H "Content-Type: application/json" \
            -d "{\"identifier\":\"$DOCKERHUB_USERNAME\",\"secret\":\"$DOCKERHUB_TOKEN\"}" \
            https://hub.docker.com/v2/auth/token)
          HTTP=$(echo "$TOKEN" | tail -n 1)
          ACCESS=$(echo "$TOKEN" | head -n -1 | jq -r .access_token)
          if [ "$HTTP" != "200" ] || [ -z "$ACCESS" ] || [ "$ACCESS" = "null" ]; then
            echo "::error::Docker Hub API 登录失败 HTTP $HTTP: $(echo "$TOKEN" | head -n -1)"
            exit 1
          fi
          jq -n --arg d "$(cat DOCKERHUB.md)" \
            '{full_description: $d,
              description: "Unofficial mirror of ghcr.io/yetone/magpie (magpie by yetone), synced daily"}' \
            > /tmp/payload.json
          RESP=$(curl -s -w "\n%{http_code}" -X PATCH -H "Authorization: Bearer $ACCESS" \
            -H "Content-Type: application/json" -d @/tmp/payload.json \
            "https://hub.docker.com/v2/repositories/$DOCKERHUB_USERNAME/magpie")
          HTTP=$(echo "$RESP" | tail -n 1)
          BODY=$(echo "$RESP" | head -n -1)
          echo "HTTP $HTTP"
          if [ "$HTTP" != "200" ]; then
            echo "::error::更新描述失败 HTTP $HTTP: $BODY"
            exit 1
          fi

      # GitHub 会停用 60 天无活动的仓库的定时 workflow,每月 1 号推一个空 commit 保活
      - name: Monthly keepalive
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" != "01" ]; then
            echo "not the 1st, skip"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive (avoid scheduled workflow disable)"
          git push
