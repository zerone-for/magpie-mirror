name: Sync magpie image to Docker Hub

# 每天 UTC 05:17(北京时间 13:17)比对并同步;push 时也跑一次(首推送即首同步)
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write # 仅供底部 keepalive 步骤推送空 commit

env:
  SRC: ghcr.io/yetone/magpie
  MOVING_TAGS: latest stable # 跟随上游移动的 tag;edge 更新太频繁,不同步
  VERSION_KEEP: "5"          # latest 轨道:保留最近多少个版本号 tag
  STABLE_KEEP: "5"           # stable 轨道:保留最近多少个 stable 版本 tag
  STABLE_FEED: https://usemagpie.ai/api/latest?channel=stable

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install skopeo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo

      - name: Check secrets
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 未设置,请到 Settings → Secrets and variables → Actions 添加"
            exit 1
          fi
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Docker Hub
        run: skopeo login docker.io -u "$DOCKERHUB_USERNAME" -p "$DOCKERHUB_TOKEN"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sync moving tags
        env:
          DST: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/magpie
        run: |
          set -euo pipefail
          for TAG in $MOVING_TAGS; do
            SRC_REF="docker://$SRC:$TAG"
            DST_REF="docker://$DST:$TAG"

            SRC_DIGEST=$(skopeo inspect "$SRC_REF" | jq -r .Digest)
            if DST_DIGEST=$(skopeo inspect "$DST_REF" 2>/dev/null | jq -r .Digest) \
               && [ "$DST_DIGEST" = "$SRC_DIGEST" ]; then
              echo "::notice::$TAG 未变化($SRC_DIGEST)"
              continue
            fi

            echo "::notice::$TAG: ${DST_DIGEST:-<不存在>} -> $SRC_DIGEST,开始复制"
            # --all 保留多架构 manifest list(amd64 / arm64)
            skopeo copy --all --retry-times 5 "$SRC_REF" "$DST_REF"
          done

      # 上游不提供 stable 版本历史,每天把当前 stable 版本记进 stable-history.json
      - name: Record stable version history
        run: |
          set -euo pipefail
          V=$(curl -fsS --retry 3 --max-time 30 "$STABLE_FEED" | jq -r '.version // empty' || true)
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::warning::stable feed 未返回有效版本($V),本次跳过记录"
            exit 0
          fi
          [ -f stable-history.json ] || echo '[]' > stable-history.json
          jq --arg v "$V" --argjson n "$STABLE_KEEP" \
            'if index($v) then . else (. + [$v])[-$n:] end' \
            stable-history.json > stable-history.tmp && mv stable-history.tmp stable-history.json
          if ! git diff --quiet -- stable-history.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add stable-history.json
            git commit -m "chore: record stable version $V [skip ci]"
            git push
          fi

      # 双轨保留:latest 轨道最近 VERSION_KEEP 个 + stable 轨道最近 STABLE_KEEP 个
      - name: Sync version tags
        env:
          DST: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/magpie
        run: |
          set -euo pipefail
          SRC_VERSIONS=$(skopeo list-tags "docker://$SRC" | jq -r '.Tags[]?' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)
          LATEST_TRACK=$(echo "$SRC_VERSIONS" | tail -n "$VERSION_KEEP")
          STABLE_TRACK=$(jq -r '.[]' stable-history.json 2>/dev/null \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)
          printf '%s\n%s\n' "$LATEST_TRACK" "$STABLE_TRACK" | sed '/^$/d' | sort -u > keep-tags.txt
          echo "保留集合:"; cat keep-tags.txt

          HUB_TAGS=$(skopeo list-tags "docker://$DST" 2>/dev/null | jq -r '.Tags[]?' || true)
          MISSING=$(comm -23 keep-tags.txt <(echo "$HUB_TAGS" | sed '/^$/d' | sort))
          if [ -z "$MISSING" ]; then
            echo "::notice::保留集合内的版本均已同步"
            exit 0
          fi
          for TAG in $MISSING; do
            echo "::notice::补同步版本 $TAG"
            skopeo copy --all --retry-times 5 "docker://$SRC:$TAG" "docker://$DST:$TAG"
          done

      # 删除保留集合之外的版本号标签;latest/stable 等非版本号标签永不触碰
      - name: Prune old version tags
        env:
          DST: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/magpie
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          HUB_VERSIONS=$(skopeo list-tags "docker://$DST" | jq -r '.Tags[]?' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort)
          TO_DELETE=$(comm -23 <(echo "$HUB_VERSIONS") <(sort keep-tags.txt) || true)
          if [ -z "$TO_DELETE" ]; then
            echo "::notice::没有需要删除的旧版本"
            exit 0
          fi
          ACCESS=$(curl -s -H "Content-Type: application/json" \
            -d "{\"identifier\":\"$DOCKERHUB_USERNAME\",\"secret\":\"$DOCKERHUB_TOKEN\"}" \
            https://hub.docker.com/v2/auth/token | jq -r .access_token)
          if [ -z "$ACCESS" ] || [ "$ACCESS" = "null" ]; then
            echo "::error::Docker Hub API 登录失败,无法删除旧标签"
            exit 1
          fi
          for TAG in $TO_DELETE; do
            HTTP=$(curl -s -o /tmp/del.json -w "%{http_code}" -X DELETE \
              -H "Authorization: Bearer $ACCESS" \
              "https://hub.docker.com/v2/repositories/$DOCKERHUB_USERNAME/magpie/tags/$TAG/")
            if [ "$HTTP" = "200" ] || [ "$HTTP" = "204" ] || [ "$HTTP" = "404" ]; then
              echo "::notice::已删除旧版本 $TAG (HTTP $HTTP)"
            else
              echo "::warning::删除 $TAG 失败 HTTP $HTTP: $(cat /tmp/del.json)"
            fi
          done

      # 仅推代码时同步镜像页描述;每日定时跑时不重复
      - name: Update Docker Hub description
        if: github.event_name == 'push'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # 当前 Docker Hub API:POST /v2/auth/token 换取 Bearer token(老 /v2/users/login + JWT 已无仓库写权限)
          TOKEN=$(curl -s -w "\n%{http_code}" -H "Content-Type: application/json" \
            -d "{\"identifier\":\"$DOCKERHUB_USERNAME\",\"secret\":\"$DOCKERHUB_TOKEN\"}" \
            https://hub.docker.com/v2/auth/token)
          HTTP=$(echo "$TOKEN" | tail -n 1)
          ACCESS=$(echo "$TOKEN" | head -n -1 | jq -r .access_token)
          if [ "$HTTP" != "200" ] || [ -z "$ACCESS" ] || [ "$ACCESS" = "null" ]; then
            echo "::error::Docker Hub API 登录失败 HTTP $HTTP: $(echo "$TOKEN" | head -n -1)"
            exit 1
          fi
          jq -n --arg d "$(cat DOCKERHUB.md)" \
            '{full_description: $d,
              description: "Unofficial mirror of ghcr.io/yetone/magpie (magpie by yetone), synced daily"}' \
            > /tmp/payload.json
          RESP=$(curl -s -w "\n%{http_code}" -X PATCH -H "Authorization: Bearer $ACCESS" \
            -H "Content-Type: application/json" -d @/tmp/payload.json \
            "https://hub.docker.com/v2/repositories/$DOCKERHUB_USERNAME/magpie")
          HTTP=$(echo "$RESP" | tail -n 1)
          BODY=$(echo "$RESP" | head -n -1)
          echo "HTTP $HTTP"
          if [ "$HTTP" != "200" ]; then
            echo "::error::更新描述失败 HTTP $HTTP: $BODY"
            exit 1
          fi

      # GitHub 会停用 60 天无活动的仓库的定时 workflow,每月 1 号推一个空 commit 保活
      - name: Monthly keepalive
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" != "01" ]; then
            echo "not the 1st, skip"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive (avoid scheduled workflow disable)"
          git push
